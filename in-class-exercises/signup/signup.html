<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
            display: flex;
            justify-content: center;
        }

        #formContainer{
            border: 10px solid #0d2e7c;
            border-radius: 20px;
            width: 400px;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }
        #closeBtn{
            position: absolute;
            margin: 12px;
            display: flex;
            align-self: start;
        }
        #formHeader{
            background-image: url('images/jesus_feeds_5000.jpeg');
            height: 200px;
            width: 100%;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: end;
            align-items: center;
        }

        h1, h2{
            color: white;
            text-shadow: 1px 1px black;
            font-size: 2.2em
        }
        h2{
            margin-bottom: 40px;
        }
        h3{
            margin: 20px;
        }

        #myForm{
            display: grid;
            grid-template-columns: 1fr 1fr;
            row-gap: 20px;
        }
        #myForm section{
            grid-column: 1 / 3;
            justify-self: center;
        }
        #bookImages{
            width: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-top: 30px;
        }
        .book{
            width: 100%;
        }
        #firstBook{
            border-bottom-left-radius: 10px;
        }
        #lastBook{
            border-bottom-right-radius: 10px;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <button type="button" id="closeBtn">X</button>
        <header id="formHeader">
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </header>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>
        <div id="bookImages">
            <img class="book" id="firstBook" src="images/old_testament.webp" alt="The cover of the Old Testament">
            <img class="book" src="images/new_testament.webp" alt="The cover of the New Testament">
            <img class="book" src="images/book_of_mormon.webp" alt="The cover of the Book of Mormon">
            <img class="book" src="images/doctrine_and_covenants.webp" alt="The cover of the Doctrine and Covenants">
            <img class="book" id="lastBook" src="images/pearl_of_great_price.webp" alt="The cover of the Pearl of Great Price">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
